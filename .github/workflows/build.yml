name: RepCount build check

on:
  push:
    branches:
      - main
      - supabase-migration
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          # GitHub-hosted runners occasionally hit an npm cache rename race.
          # Retry once with a clean cache; a real dependency/build error still fails CI.
          npm install --no-audit --no-fund || {
            npm cache clean --force
            npm install --no-audit --no-fund
          }
      - name: Test demo, renewal logic and gym installer
        run: npm test
      - name: Generate example fresh-gym database installer
        run: npm run setup:gym -- --gym "CI Test Gym" --admin-email owner@example.com --project-ref abcdefghijklmnopqrst
      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check_placeholder
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Assert no Apper runtime remains
        shell: bash
        run: |
          if grep -R -n -E 'window\.ApperSDK|VITE_APPER_|MemoryAdapter|ApperAdapter|currentMockOwner' src index.html; then
            echo "Found an Apper runtime or mock-data reference."
            exit 1
          fi
      - name: Set up Python for SQL parsing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SQL migration syntax
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from glob import glob
          from pglast import parse_sql

          paths = sorted(glob("supabase/migrations/*.sql")) + ["supabase/bootstrap_admin.sql", ".repcount-setup/01_create_database.sql", ".repcount-setup/02_create_first_admin.sql"]
          for path in paths:
              parse_sql(open(path, encoding="utf-8").read())
              print(f"SQL parsed: {path}")
          PY
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/admin-users/index.ts
          deno check supabase/functions/secure-login/index.ts
          deno check supabase/tests/login_throttle.test.ts
      - name: Test login rate-limit identity
        run: deno test supabase/tests/login_throttle.test.ts
